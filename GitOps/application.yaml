apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
   name: nginx
   namespace: openshift-gitops
spec:
   project: laboratorio
   source:
      repoURL: https://github.com/cfonseca30/nginx-openshift-starter.git
      targetRevision: dev
      path: manifiests
   destination:
      server: https://kubernetes.default.svc
      namespace: nginx-demo
   syncPolicy:
      automated:
         prune: true
         selfHeal: true